<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabmoor store screenshot: popup</title>
<link rel="stylesheet" href="shots.css">
</head>
<body>
  <section class="copy">
    <div class="brand"><img src="/extension/icons/tabmoor.svg" alt=""><span>Tabmoor</span></div>
    <h1>Lost a pinned tab? One click.</h1>
    <ul>
      <li><b>Fix pinned tabs</b> puts everything back in place</li>
      <li><b>Add this page</b> saves the site you're on</li>
      <li>Never touches your tab groups</li>
    </ul>
  </section>

  <div class="window">
    <div class="tabstrip">
      <span class="pin" style="--c:#4285F4">G</span>
      <span class="pin" style="--c:#FF3D3D">Y</span>
      <span class="pin" style="--c:#E6E6E6">W</span>
      <span class="pin" style="--c:#C7C7CC">A</span>
      <span class="pin" style="--c:#FF9900">a</span>
      <span class="tab active">New Tab</span>
    </div>
    <div class="toolbar">
      <span class="nav">‹ ›</span>
      <span class="url">Search or enter address</span>
      <span class="ext"><img src="/extension/icons/tabmoor-small.svg" alt=""></span>
    </div>
    <div class="page"></div>
    <div class="frame popup">
      <iframe src="frame.html?page=popup&amp;demo=fix" title="Tabmoor popup"></iframe>
    </div>
  </div>
</body>
</html>
